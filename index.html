  if(!offers.length)offers.push({team:pick(TEAMS).id,salary:Math.round(capOf(y)*.012),years:1,opt:false,min:true});
  return offers}


/* =========================================================
   COURTSIDE — career flow: high school, college, draft,
   G League, offseason, free agency, national team, retirement
   ========================================================= */
function seasonEndFlow(){
  const se=S.season,p=P(),st=se.st;
  if(se.kind==='hs'){
    S.stars=clamp(Math.round((ovr()-44)/5+per(st,'pts')/12),1,5);
    S.history.push({y:seasonLabel(se.year),lvl:'High school',team:S.school,gp:st.gp,ppg:+per(st,'pts').toFixed(1),rpg:+per(st,'reb').toFixed(1),apg:+per(st,'ast').toFixed(1),rec:`${se.w}-${se.l}`,ovr:ovr()});
    news(`${p.name} finishes the high school season: ${per(st,'pts').toFixed(1)} ppg. Recruiting rating: ${'★'.repeat(S.stars)}.`);
    if(se.w>=20){S.trophies.push({n:'State Champion',y:seasonLabel(se.year),hs:true});cele({type:'award',n:'State Champion',y:se.year})}
    advanceYear();
    if(p.age>=18){S.stage='recruit';S.offersCol=collegeOffers()}else{newSeason()}
    return;
  }
  if(se.kind==='col'){
    S.history.push({y:seasonLabel(se.year),lvl:'NCAA',team:S.college,gp:st.gp,ppg:+per(st,'pts').toFixed(1),rpg:+per(st,'reb').toFixed(1),apg:+per(st,'ast').toFixed(1),rec:`${se.w}-${se.l}`,ovr:ovr(),po:se.mmRes||''});
    advanceYear();S.stage='declare';return;
  }
  if(se.kind==='gl'){
    S.history.push({y:seasonLabel(se.year),lvl:S.glName||'G League',team:S.glName||'G League',gp:st.gp,ppg:+per(st,'pts').toFixed(1),rpg:+per(st,'reb').toFixed(1),apg:+per(st,'ast').toFixed(1),rec:`${se.w}-${se.l}`,ovr:ovr()});
    advanceYear();
    if(S.glNext){S.glNext=false;S.stage='draft';return}
    const t=TEAMS.slice().sort((a,b)=>tStr(a.id)-tStr(b.id))[RI(0,9)];
    if(ovr()>=tStr(t.id)-9||Math.random()<.25){S.offers=[{team:t.id,salary:Math.round(capOf(S.year)*.012),years:2,opt:false,min:true}];S.stage='fa'}
    else{S.phase='gl';newSeason();news(`No call-up yet. Another season in the G League.`)}
    return;
  }
  if(se.kind==='nba'){
    endNbaSeason();natTeamSummer(S.year+1);
    advanceYear();
    if(S.ringNext){}
    const p2=P(),c=S.contract;c.years--;
    if(p2.age>=41||(p2.age>=36&&ovr()<64)){S.stage='retireForced';return}
    if(c.years<=0){S.offers=faOffers();S.stage='fa';news(`${p2.name} is a free agent.`);return}
    if(c.years===1&&ovr()>=78&&Math.random()<.65){S.ext={team:c.team,salary:salaryFor(ovr()+1,S.year),years:RI(2,4)};S.stage='ext';return}
    S.stage='offseason';return;
  }
}
function advanceYear(){const p=P();S.year++;p.age++;ageDecline();p.fitness=95;p.form=[];p.injury=Math.max(0,p.injury-20);if(!p.injury)p.injName='';
  /* league drift: rising and falling teams */
  S.boost=S.boost||{};const fut=S.year>2026;TEAMS.forEach(t=>{S.boost[t.id]=clamp((S.boost[t.id]||0)*(fut?.85:.6)+n01()*(fut?3:2.2),fut?-12:-7,fut?12:7)});
  /* front office builds around a star */
  try{if(S.phase==='nba'&&S.contract&&ovr()>=84){const id=S.contract.team;if(tStr(id)<80)S.boost[id]=clamp((S.boost[id]||0)+R(1.5,3.5),-12,14)}}catch(e){}
  if(S.contract&&S.contract.salary&&S.phase==='nba')p.money+=S.contract.salary*.62;}
function startNextSeason(){S.stage=null;newSeason();save()}

/* ---------- recruiting & college ---------- */
function collegeOffers(){const s=S.stars;const pool=COLLEGES.slice().sort((a,b)=>b[1]-a[1]);const top=s>=5?pool.slice(0,8):s>=4?pool.slice(3,13):s>=3?pool.slice(8,18):pool.slice(12);
  return top.sort(()=>Math.random()-.5).slice(0,4).map(c=>c[0])}
function chooseCollege(n){S.college=n;S.phase='college';S.stage=null;newSeason();news(`${P().name} commits to ${n}.`);save()}
function chooseAbroad(){S.phase='gl';S.glName='NBL Next Stars · '+pick(NBL_NEXT);S.glNext=true;S.stage=null;newSeason();news(`${P().name} turns pro in Australia's NBL as a Next Star.`);save()}

  if(!qual){se.mmRes='Missed tournament';return}
  const seedS=clamp(Math.round(17-(levelBase()+18-70)/1.6-(se.w-18)*.3),1,16);se.mm={seed:seedS,round:0};news(`${S.college} make March Madness as a No. ${seedS} seed.`)}

/* ---------- the draft ---------- */
function draftValue(){const st=S.season&&S.season.st||{gp:0};return ovr()+(P().pot-ovr())*.5+(st.gp?per(st,'pts')*.25:0)+(S.stars||2)*.8-(P().age-19)*1.2}
function runDraft(){
  const v=draftValue(),y=S.year,fromWhere=S.phase==='college'?S.college:S.phase==='gl'?(S.glName||'G League'):S.school;let pk=Math.round((86-v)*1.7+n01()*3);pk=clamp(pk,1,70);
  const order=TEAMS.slice().map(t=>({id:t.id,s:tStr(t.id,y)+n01()*3})).sort((a,b)=>a.s-b.s);
  /* lottery shuffles the top 14 a bit */
  for(let i=0;i<4;i++){const j=RI(0,13),k=RI(0,13);[order[j],order[k]]=[order[k],order[j]]}
  if(pk>60){S.drafted=null;news(`${P().name} goes undrafted in the ${y} NBA Draft.`);cele({type:'draft',undrafted:true,y});S.phase='gl';S.glName='G League';S.glNext=false;S.stage=null;newSeason();save();return}
  const tid=order[(pk-1)%30].id;S.drafted={pick:pk,team:tid,y};
  S.phase='nba';S.contract={team:tid,salary:rookieSalary(pk,y),years:4,rookie:true};S.nbaSeasons=0;
  S.trophies.push({n:`NBA Draft · No. ${pk} pick`,y:String(y),draft:true});
  news(`With the ${ordinal(pk)} pick, the ${tName(tid,y)} select ${P().name}.`);cele({type:'draft',pick:pk,team:tid,y,from:fromWhere});

}
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};

/* ---------- free agency, extension, trade ---------- */
function signOffer(i){const o=S.offers[i];if(!o)return;const moved=S.contract&&S.contract.team&&S.contract.team!==o.team;
  S.phase='nba';S.contract={team:o.team,salary:o.salary,years:o.years,opt:o.opt};S.offers=null;S.stage=null;
  news(`${P().name} signs with the ${tName(o.team)}: ${o.years} years, ${money(o.salary)} a year.`);if(moved||!S.nbaSeasons)cele({type:'signing',team:o.team,salary:o.salary,years:o.years});
  if(S.nbaSeasons===undefined)S.nbaSeasons=0;newSeason();save()}
function acceptExt(){const e=S.ext;S.contract={team:e.team,salary:e.salary,years:e.years+1};S.ext=null;S.stage=null;news(`${P().name} signs a ${e.years}-year extension with the ${tName(e.team)} (${money(e.salary)} a year).`);newSeason();save()}
function declineExt(){S.ext=null;S.stage=null;newSeason();save()}
function requestTrade(){const se=S.season;if(!se||se.kind!=='nba'||se.phase!=='reg'||se.gi>=50||S.tradeY===S.year)return false;
  const cands=TEAMS.filter(t=>t.id!==se.team).sort(()=>Math.random()-.5).slice(0,3);const to=cands.sort((a,b)=>tStr(b.id)-tStr(a.id))[0].id;
  if(Math.random()<.35+(ovr()-tStr(se.team))*.02){S.tradeY=S.year;const old=se.team;S.contract.team=to;
    /* keep the record so far: you join the new team's season */
    se.team=to;const left=82-se.gi;const others=TEAMS.filter(t=>t.id!==to).map(t=>t.id);se.sched=se.sched.slice(0,se.gi).concat(Array.from({length:left},(_,i)=>({opp:others[(i*7)%29],home:i%2===0})));
    news(`Trade! ${P().name} is dealt from the ${tName(old)} to the ${tName(to)}.`);cele({type:'signing',team:to,trade:true,salary:S.contract.salary,years:S.contract.years});save();return true}
  S.tradeY=S.year;P().trust=clamp(P().trust-12,0,100);news(`${P().name} asks for a trade, but no deal gets done.`);save();return 'nodeal';
}

/* ---------- national team ---------- */
function natEvent(y){
  const oly=[2000,2004,2008,2012,2016,2021,2024,2028,2032,2036,2040,2044,2048,2052,2056];const wc=[2002,2006,2010,2014,2019,2023,2027,2031,2035,2039,2043,2047,2051,2055];
  if(oly.includes(y))return {n:'Olympic Games',k:'oly'};if(wc.includes(y))return {n:'FIBA World Cup',k:'wc'};
  if((y<2017&&y%2===1)||(y>=2022&&(y-2022)%4===3||y===2022))return {n:CONF_CUP[nationOf(P().nation).conf],k:'conf'};return null}
function natTeamSummer(y){
  const ev=natEvent(y),p=P(),nat=nationOf(p.nation);if(!ev||p.age<19||p.injury>10)return;
  const need=nat.s-(nat.s>=90?2:nat.s>=80?6:12);if(ovr()<need){if(ovr()>=need-4)news(`${p.name} just misses the ${nat.n} roster for the ${y} ${ev.n}.`);return}
  const field=(ev.k==='conf'?NATIONS.filter(n=>n.conf===nat.conf):NATIONS).slice().sort((a,b)=>b.s-a.s);const strength=nat.s+Math.max(0,ovr()-nat.s)*.35;
  if(ev.k==='oly'&&!field.slice(0,12).some(n=>n.n===nat.n)&&Math.random()<.7){news(`${nat.n} fail to qualify for the ${y} Olympics.`);return}
  const st=blankStats();let alive=true,round=0;const rounds=['Group stage','Quarter-final','Semi-final','Final'],opps=[];
  for(let g=0;g<3;g++){const o=pick(field.filter(n=>n.n!==nat.n).slice(0,24));const L=gameLine(RI(26,34),strength,o.s);addLine(st,L,true);opps.push(o)}
  let groupW=0;opps.forEach(o=>{if(Math.random()<1/(1+Math.pow(10,-(strength-o.s)/11)))groupW++});
  if(groupW<2){alive=false}
  let medal=null;
  if(alive){for(round=1;round<=3;round++){const o=field.filter(n=>n.n!==nat.n)[clamp(RI(0,12-round*3),0,30)];const L=gameLine(RI(28,36),strength,o.s);addLine(st,L,true);
    const w=Math.random()<1/(1+Math.pow(10,-(strength-o.s)/11));
    if(round===2&&!w){/* bronze game */const o2=pick(field.slice(2,10));const L2=gameLine(RI(28,34),strength,o2.s);addLine(st,L2,true);if(Math.random()<1/(1+Math.pow(10,-(strength-o2.s)/11)))medal='Bronze';break}
    if(!w){if(round===3)medal='Silver';break}if(round===3)medal='Gold'}}
  S.intl.caps+=st.gp;S.intl.pts+=st.pts;
  const res=medal?`${medal} medal`:alive?`Out in the ${rounds[Math.min(round,3)].toLowerCase()}`:'Out in the group stage';
  news(`${y} ${ev.n}: ${nat.n} — ${res}. ${p.name}: ${per(st,'pts').toFixed(1)} ppg.`);
  if(medal){S.intl.medals.push({m:medal,ev:ev.n,y});S.trophies.push({n:`${ev.n} ${medal}`,y:String(y),intl:true,k1:nat.k1,k2:nat.k2})}
  cele({type:'intl',ev:ev.n,y,nat:nat.n,res,medal,ppg:per(st,'pts').toFixed(1),k1:nat.k1,k2:nat.k2});
}

/* ---------- play loop ---------- */
function doPlay(n){
  let r='ok',i=0;
  while(i<n){
    const se=S.season;if(!se||S.stage)break;
    /* clutch moment (only on manual single games, or sims stop for it) */
    const o=curOpp();if(!o){r='end';break}
    const p=P(),canClutch=p.injury===0&&(se.kind!=='hs')&&Math.random()<(se.phase==='po'?.16:.08)&&roleFor(ovr(),levelBase())!=='Deep bench';
    if(canClutch){if(i>0){r='stop';break}save();render();clutchScene(res=>{const rr=playGame(res);afterGame(rr,true)});return}
    r=playGame();i++;
    const last=se.last;
    if(r!=='ok')break;
    if(n>1&&last&&(last.pts>=40||(last.plays&&last.plays.some(x=>x.gw))))break;
    if(S.cele&&S.cele.length)break;
  }
  afterGame(r,n===1);
}
function afterGame(r,manual){
  const se=S.season;HOOKS.afterGame.forEach(f=>{try{f(r,manual)}catch(e){console.error(e)}});
  if(r==='seasonEnd'||r==='poEnd'){if(se.kind==='nba'&&se.po&&!se.po.champ)simRestOfPlayoffs();seasonEndFlow()}
  else if(r==='regEnd'){if(se.po&&se.po.out)seasonEndFlow();else cele({type:'playoffs',seed:se.seed,y:S.year})}
  save();window.HOLD_CELE=!!manual;render();window.HOLD_CELE=false;
  const last=se.last;
  const cine=()=>{if(manual&&last&&last.plays&&last.plays.some(x=>x.gw||x.big)&&!modal.innerHTML)shotCine(last,0,()=>{render()});
    else if(manual&&last&&last.min&&last.pts>=30&&last.plays&&last.plays.length&&!modal.innerHTML)shotCine(last,0,()=>{render()});
    else if(!modal.innerHTML)showNextModal()};
  if(manual&&last&&typeof liveView==='function'&&!S.noLive&&last.kind)liveView(last,cine);else cine();
  publishSoon();
}

function cupKnockout(){const se=S.season,id=se.team,qual=(se.cupW||0)>=3||((se.cupW||0)===2&&Math.random()<.35);const field=TEAMS.map(t=>t.id).sort((a,b)=>tStr(b)-tStr(a)+n01()*4);

  for(let ri=0;ri<3;ri++){const opp=opps[ri],L=gameLine(RI(30,38),levelBase(),tStr(opp));addLine(st,L,true);
    const d=levelBase()+(ovr()-levelBase())*.3-tStr(opp)+(L.gs-12)*.06,w=Math.random()<1/(1+Math.pow(10,-d/13));

  if(out==='champ'){S.cups=(S.cups||[]).concat({y:se.year,champ:id,me:true});S.trophies.push({n:'NBA Cup',y:String(se.year),team:id});const mvp=per(st,'pts')>=22&&Math.random()<.6;if(mvp)S.awards.push({n:'NBA Cup MVP',y:String(se.year)});news(`The ${tName(id)} win the ${se.year} NBA Cup!${mvp?' '+P().name+' is Cup MVP.':''}`);cele({type:'cup',won:true,ppg:per(st,'pts').toFixed(1),mvp})}
  else{const champ=alive[0];S.cups=(S.cups||[]).concat({y:se.year,champ});news(`NBA Cup: the ${tName(id)} are knocked out in the ${out.toLowerCase()} (${per(st,'pts').toFixed(1)} ppg). ${tName(champ)} lift the Cup.`);cele({type:'cup',won:false,out,ppg:per(st,'pts').toFixed(1)})}
}

    chicago:x=>{ctx.fillRect(x-12,base-170,24,170);ctx.fillRect(x-8,base-190,4,20);ctx.fillRect(x+4,base-190,4,20)},
    boston:x=>{ctx.fillRect(x-8,base-130,16,130);ctx.beginPath();ctx.moveTo(x-8,base-130);ctx.lineTo(x,base-150);ctx.lineTo(x+8,base-130);ctx.fill()},

    philly:x=>{ctx.fillRect(x-10,base-120,20,120);ctx.beginPath();ctx.moveTo(x-10,base-120);ctx.lineTo(x,base-145);ctx.lineTo(x+10,base-120);ctx.fill()},
    dc:x=>{ctx.beginPath();ctx.moveTo(x-6,base);ctx.lineTo(x-3,base-150);ctx.lineTo(x,base-158);ctx.lineTo(x+3,base-150);ctx.lineTo(x+6,base);ctx.fill()},

function drawArena(cv,id){

  else{ctx.beginPath();ctx.ellipse(cx,by,bw/2,bh,0,Math.PI,0);ctx.fillStyle='#2b2732';ctx.fill();ctx.beginPath();ctx.ellipse(cx,by-bh*.82,bw*.42,bh*.24,0,0,6.3);ctx.fillStyle='#3d3746';ctx.fill();ctx.fillStyle=t.k1;ctx.globalAlpha=.85;ctx.fillRect(cx-bw/2+30,by-22,bw-60,10);ctx.globalAlpha=1;for(let i=0;i<14;i++){const a=Math.PI+i/13*Math.PI,x=cx+Math.cos(a)*bw*.46,y=by+Math.sin(a)*bh*.9;ctx.fillStyle='rgba(255,220,150,.7)';ctx.fillRect(x-2,y,4,10)}}

function mgmtSeasonEnd(){const se=S.season,T=se.table[se.team],champ=se.po&&se.po.champ===se.team,y=S.year;
  S.history.push({y:seasonLabel(y),lvl:isCoach()?'Coach':'Owner',team:tName(se.team),tid:se.team,gp:82,ppg:0,rpg:0,apg:0,pts:0,reb:0,ast:0,rec:`${T.w}-${T.l}`,po:champ?'Champion':se.madePO?'Playoffs':'Missed',aw:[]});
  try{const br=se.po,f=br&&br.rounds[3]&&br.rounds[3][0];if(br&&br.champ)S.champs=(S.champs||[]).concat({y:y+1,champ:br.champ,ru:f?(f.a===br.champ?f.b:f.a):null,fmvp:(myRoster()[0]||{}).n||'',mvp:'',me:champ})}catch(e){}
  if(isCoach()){const ch=S.ch;ch.w+=T.w;ch.l+=T.l;ch.seasons++;const over=T.w-se.expect;ch.rating=clamp(ch.rating+over*.35+(champ?6:0)+(se.madePO?1:-1),30,99);ch.rep=clamp(ch.rep+over*.8+(champ?18:se.madePO?4:-4),0,100);
    if(over>=10&&Math.random()<.65){ch.coy++;S.awards.push({n:'Coach of the Year',y:seasonLabel(y)});S.history[S.history.length-1].aw.push('Coach of the Year');cele({type:'award',n:'Coach of the Year',y})}
    ch.years--;const fired=over<=-10||(over<=-5&&Math.random()<.5);
    agingRoster();S.year++;ch.age++;S.player.age=ch.age;
    if(fired){news(`The ${tName(se.team)} fire ${S.player.name} after a ${T.w}–${T.l} season.`);S.stage='jobs';S.jobs=coachJobs();cele({type:'fired'})}
    else if(ch.years<=0){S.stage='jobs';S.jobs=[{team:se.team,salary:Math.round(ch.salary*1.15),years:RI(2,5),re:true}].concat(coachJobs()).slice(0,3)}
    else S.stage='coachOff';
    if(ch.age>=72)S.stage='mgmtRetire';
  }else{const o=S.own,cap=capOf(y),pay=[.82,1.0,1.28][o.payroll-1]*cap,tax=o.payroll===3?pay*.35:0,gate=team(o.team).cap*41*[85,140,210][o.ticket-1]*(.6+o.fans/250)*(1+o.arena*.08),tv=cap*1.35,po=se.madePO?(se.po.rounds.length*25e6):0,costs=pay+tax+30e6+o.arena*8e6;
    const rev=gate+tv+po,profit=Math.round(rev-costs);o.cash+=profit;o.seasons++;o.fans=clamp(o.fans+(T.w-41)*.5+(champ?15:0)-(o.ticket-2)*4+(o.payroll-2)*2,5,100);
    o.talent=clamp(o.talent*.7+(o.payroll-2)*1.6,-4,6);o.last={rev:Math.round(rev),costs:Math.round(costs),profit};o.value=Math.round(teamPrice(o.team)*(1+o.fans/400+(S.rings||0)*.04));
    news(`Owner report ${seasonLabel(y)}: revenue ${money(rev)}, costs ${money(costs)}, ${profit>=0?'profit':'loss'} ${money(Math.abs(profit))}.`);
    S.year++;S.player.age++;if(o.cash<-4e8){S.stage='mgmtBroke'}else S.stage='ownOff';if(S.player.age>=80)S.stage='mgmtRetire'}
  save()}
function agingRoster(){const se=S.season;se.roster.forEach(p=>{p.age++;const g=p.age<=23?R(0,2.5):p.age<=27?R(-.8,1.2):p.age<=31?R(-2,.3):-R(2,4.5);p.r=clamp(Math.round(p.r+g),50,95)});
  /* free agency: good veterans can leave, salary-cap pressure */
  const vets=se.roster.filter(p=>p.age>=27&&p.r>=80);if(vets.length&&Math.random()<.45){const gone=vets[Math.floor(Math.random()*vets.length)];se.roster=se.roster.filter(p=>p!==gone);news(`${gone.n} leaves in free agency.`)}
  if(se.roster.filter(p=>p.r>=82).length>=4&&Math.random()<.5){const top=se.roster.slice().sort((a,b)=>b.r-a.r)[3];se.roster=se.roster.filter(p=>p!==top);news(`Luxury-tax bills force the team to let ${top.n} walk.`)}
  se.roster=se.roster.filter(p=>p.age<=38);const T=se.table[se.team],pk=clamp(Math.round((T.w/82)*30),1,30),r=srng('rk'+S.year+S.cid);se.roster.push({n:fakeName(r),pos:pick(Object.keys(POS)),r:Math.round(clamp(74-pk*.4+n01()*3,62,82)),age:19,rookie:true});
  while(se.roster.length<12)se.roster.push({n:fakeName(r),pos:pick(Object.keys(POS)),r:RI(62,72),age:RI(24,31)});se.roster=se.roster.sort((a,b)=>b.r-a.r).slice(0,13)}

function tradeOffers(){const se=S.season,r=srng('tr'+S.year+se.gi);return myRoster().slice(2,9).sort(()=>r()-.5).slice(0,3).map(p=>{const other=TEAMS.filter(t=>t.id!==se.team)[Math.floor(r()*29)].id,g=Math.round(clamp(p.r+(r()-.55)*6,55,93));return {give:p.n,get:{n:fakeName(r),pos:pick(Object.keys(POS)),r:g,age:RI(21,32)},team:other}})}

     <div class="actions"><button class="btn primary" id="mNext">Start ${seasonLabel(S.year)}</button><button class="btn ghost" id="mRetire">Sell the team (${money(o.value||teamPrice(o.team))})</button></div>`}</div>`}
  else if(se){const T=se.table[se.team],o2=se.phase==='po'?poNext():se.sched[se.gi];c=`<div class="panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2>${se.phase==='po'?'Playoffs':'Season'}</h2><span class="chip amber">${se.phase==='po'?'Postseason':`Game ${se.gi+1} of 82`}</span></div>
    <div class="fixture"><div class="t">${logo(se.team,0,1)}<span class="nm">${esc(tName(se.team))}</span><span class="hint">${T.w}–${T.l} · fans expect ${se.expect}</span></div><span class="vs">${o2&&o2.home?'vs':'@'}</span><div class="t r">${o2?logo(o2.opp,0,1)+`<span class="nm">${esc(tName(o2.opp))}</span>`:''}</div></div>

HOOKS.bind.push(()=>{if(!isMgmt())return;const $=id=>document.getElementById(id),go=fn=>{fn();save();render()};
  const cv=$('arenaCv2');if(cv&&S.own&&S.own.team)drawArena(cv,S.own.team);
  document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>go(()=>{const j=S.jobs[+b.dataset.job];S.ch.team=j.team;S.ch.salary=j.salary;S.ch.years=j.years;S.player.money+=0;if(!j.re){S.season=null}S.stage=null;news(`${S.player.name} is the new head coach of the ${tName(j.team)}.`);startMgmtSeason(j.team);cele({type:'signing',team:j.team,salary:j.salary,years:j.years,coach:true})}));
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>go(()=>{const id=b.dataset.buy,pr=teamPrice(id);S.own.cash-=pr;S.own.team=id;S.own.value=pr;S.stage=null;news(`${S.player.name} buys the ${tName(id)} for ${money(pr)}.`);startMgmtSeason(id);cele({type:'bought',team:id,price:pr})}));
  document.querySelectorAll('[data-tac]').forEach(b=>b.onclick=()=>go(()=>{const [k,v]=b.dataset.tac.split(':');S.season.tac[k]=v}));
  document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>go(()=>{S.season.dev=+b.dataset.dev}));
  document.querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>go(()=>{const t=tradeOffers()[+b.dataset.trade],se=S.season,i=se.roster.findIndex(p=>p.n===t.give);if(i<0)return;se.roster.splice(i,1,{...t.get});se.trades++;news(`Trade: ${t.give} to the ${tName(t.team)} for ${t.get.n}.`)}));
  document.querySelectorAll('[data-tk2]').forEach(b=>b.onclick=()=>go(()=>{S.own.ticket=+b.dataset.tk2}));
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>go(()=>{S.own.payroll=+b.dataset.pay}));
  document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>go(()=>{const k=coachCands()[+b.dataset.hire];S.own.coach=k;S.own.cash-=8e6;news(`New head coach: ${k.name}.`)}));
  if($('mArena'))$('mArena').onclick=()=>go(()=>{const o=S.own,c=60e6*(o.arena+1);if(o.cash<c)return;o.cash-=c;o.arena++;news(`Arena upgrade to level ${o.arena}.`)});
  if($('mNext'))$('mNext').onclick=()=>go(()=>{S.stage=null;startMgmtSeason(S.season?S.season.team:(S.own||S.ch).team);if(S.ringPending){cele({type:'ring',n:S.rings,team:S.ringPending});S.ringPending=null}});
  if($('mRetire'))$('mRetire').onclick=()=>{if(!$('mRetire').dataset.sure){$('mRetire').dataset.sure=1;$('mRetire').textContent='Tap again to confirm';return}go(()=>{if(isOwner()){S.own.cash+=S.own.value||teamPrice(S.own.team)}S.phase='retired';S.stage=null;news(`${S.player.name} steps away. ${S.rings} championship${S.rings===1?'':'s'}.`);publishCareer()})};
  const run=n=>{let r='ok',i=0;while(i<n&&r==='ok'){r=mgmtGame();i++;if(S.cele&&S.cele.length&&n<900)break}if(S.season&&S.season.po&&S.season.po.champ===S.season.team&&!S.ringPending)S.ringPending=S.season.team;save();render();publishSoon()};
  if($('mPlay'))$('mPlay').onclick=()=>run(1);if($('mSim10'))$('mSim10').onclick=()=>run(10);if($('mSimEnd'))$('mSimEnd').onclick=()=>run(999)});

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const within=(pr,ms,what)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'timed out '+what}),ms))]);
async function initOnline(){

    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);DB=firebase.firestore();try{DB.settings({ignoreUndefinedProperties:true,merge:true,experimentalForceLongPolling:true})}catch(e){}

const isOldAcc=cu=>/@players\.touchline\.app$/i.test(cu&&cu.email||'');
function accRefresh(){try{const cu=firebase.auth().currentUser;if(!cu)return;ACC.user=cu.isAnonymous?null:(cu.displayName||(isOldAcc(cu)?(cu.email||'').split('@')[0]:'Player'));ACC.email=cu.isAnonymous||isOldAcc(cu)?'':(cu.email||'');ACC.old=!cu.isAnonymous&&isOldAcc(cu);ACC.verified=!!cu.emailVerified}catch(e){}}
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(e||'').trim()),cleanUser=u=>String(u||'').trim().toLowerCase().replace(/\s+/g,'').replace(/[^a-z0-9_.-]/g,''),validUser=u=>/^[a-z0-9_.-]{3,20}$/.test(u);
function accErr(e){const c=e&&e.code||'';return c.includes('email-already-in-use')||c.includes('credential-already-in-use')?'That email already has an account. Log in instead (Touchline accounts work here too).':c.includes('invalid-email')?'That email doesn\'t look right.':c.includes('weak-password')?'Password needs at least 6 characters.':c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-login')?'Wrong email or password.':c.includes('too-many-requests')?'Too many tries. Wait a minute.':c.includes('network')?'No connection.':c.includes('permission')?'The database blocked this. See the note below.':'Something went wrong. Try again.'}
async function accCreate(em,p,u){em=String(em).trim().toLowerCase();u=cleanUser(u);if(!validEmail(em))throw {msg:'Type a real email address.'};if(!validUser(u))throw {msg:'Player name: 3–20 letters or numbers.'};
  const auth=firebase.auth(),cred=firebase.auth.EmailAuthProvider.credential(em,p);let user;if(auth.currentUser&&auth.currentUser.isAnonymous)user=(await auth.currentUser.linkWithCredential(cred)).user;else user=(await auth.createUserWithEmailAndPassword(em,p)).user;
  try{await user.updateProfile({displayName:u})}catch(e){}try{await user.sendEmailVerification()}catch(e){}UID=user.uid;accRefresh();publishCareer()}
async function accLogin(u,p){u=String(u).trim();const em=u.includes('@')?u.toLowerCase():`${cleanUser(u)}@players.touchline.app`;await firebase.auth().signInWithEmailAndPassword(em,p);archiveCareer();try{localStorage.removeItem(KEY)}catch(e){}location.reload()}

  year:S.year,pts:c.pts,seasons:c.seasons,rings:S.rings,mvp:S.mvp,legacy:legacyOf(),retired:S.phase==='retired',rv:S.rv||0,user:ACC.user||null,updated:Date.now()}}
